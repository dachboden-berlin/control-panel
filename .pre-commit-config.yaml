repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.12
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 0.11.7
  hooks:
    - id: uv-lock
- repo: local
  hooks:
    - id: ty
      name: ty check
      entry: ty check .
      language: system
      pass_filenames: false
      always_run: true
      stages: [pre-push]
- repo: local
  hooks:
    - id: pytest
      name: pytest
      entry: pytest
      language: system
      pass_filenames: false
      always_run: true
      stages: [pre-push]